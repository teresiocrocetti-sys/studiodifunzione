<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bollamania</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bollamania">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #wrap{position:relative;box-shadow:0 0 40px rgba(120,255,180,.15)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.22) 3px),
               radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
  body{-webkit-touch-callout:none}
  #stick{position:fixed;width:96px;height:96px;margin:-50px 0 0 -50px;border:2px solid rgba(125,255,178,.6);border-radius:50%;display:none;pointer-events:none;z-index:5}
  #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(125,255,178,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="512" height="448"></canvas><div id="crt"></div></div>
<div id="stick"><div id="knob"></div></div>
<script>
"use strict";
// ---------- costanti ----------
const W=512,H=448,T=16,COLS=32,ROWS=26,OY=32,MAPH=ROWS*T;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

// ---------- sprite pixel-art ----------
function sprite(rows,pal,s=2){
  const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;
  const g=c.getContext('2d');
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s);}}));
  return c;
}
function flip(src){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const g=c.getContext('2d');g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c;
}
const P_ROWS=[
"....OOOO....",
"..OOOOOOOO..",
".OOOOOOWWWO.",
".OOOOOWWKKO.",
"OOOOOOWWKKOO",
"OOOOOOOWWWOO",
"OOOOOOOOOOMM",
"OOYYYYYYOOO.",
"OYYYYYYYYOO.",
".OYYYYYYOO..",
"..OOOOOOOO..",
"..BBB..BBB..",
".BBBB.BBBB.."];
const E_ROWS=[
"....CCCC....",
"..CCCCCCCC..",
".CCCCCCCCCC.",
".CWWCCCCWWC.",
"CCWKCCCCKWCC",
"CCCCCCCCCCCC",
"CCCRRRRRRCCC",
"CCCRCRRCRCCC",
"CCCCCCCCCCCC",
".CCCCCCCCCC.",
".CC.CCCC.CC.",
"CC..C..C..CC"];
const G_ROWS=[
"...WWWWWW...",
".WWWWWWWWWW.",
"WWWWWWWWWWWW",
"WWKKWWWWKKWW",
"WWKKWWWWKKWW",
"WWWWWWWWWWWW",
"WWWWWKKWWWWW",
"WWWWKKKKWWWW",
"WWWWWWWWWWWW",
"WWWWWWWWWWWW",
"WW.WWW.WWW.W",
"W...W...W..."];
const sprP=sprite(P_ROWS,{O:'#ff8a3d',W:'#fff',K:'#111',Y:'#ffe08a',M:'#ff5577',B:'#8a4b1f'});
const SP={r:sprP,l:flip(sprP)};
const EPAL=[{C:'#4fa8ff',W:'#fff',K:'#111',R:'#1b2a6b'},{C:'#b76bff',W:'#fff',K:'#111',R:'#ffd23f'}];
const APAL={C:'#ff4a4a',W:'#fff',K:'#111',R:'#ffd23f'};
const SE=EPAL.map(p=>{const n=sprite(E_ROWS,p),a=sprite(E_ROWS,APAL);return{n:{r:n,l:flip(n)},a:{r:a,l:flip(a)}};});
const SG=sprite(G_ROWS,{W:'#e8f0ff',K:'#222'});

// ---------- livelli (originali) ----------
// p: [riga, colonnaInizio, colonnaFine]  e: [colonna, rigaPiattaforma, tipo]
const LEVELS=[
 {c:['#d84b8a','#ff9ccc'],
  p:[[21,4,11],[21,20,27],[17,2,7],[17,12,19],[17,24,29],[13,4,11],[13,20,27],[9,2,7],[9,12,19],[9,24,29],[5,8,23]],
  e:[[8,13,0],[23,13,0],[15,9,0],[15,5,0]]},
 {c:['#3d7bd9','#9cc8ff'],
  p:[[21,2,10],[21,21,29],[17,8,23],[13,2,10],[13,21,29],[9,8,23],[5,2,10],[5,21,29]],
  e:[[6,13,0],[25,13,0],[12,9,1],[19,9,0],[6,5,1]]},
 {c:['#e08a1e','#ffd08a'],
  p:[[21,2,12],[21,19,29],[17,6,25],[13,2,12],[13,19,29],[9,6,25],[5,2,12],[5,19,29]],
  e:[[8,17,1],[20,17,1],[4,13,0],[26,13,0],[14,9,1],[10,5,0]]},
 {c:['#2fa85a','#9cf0b4'],
  p:[[21,4,8],[21,23,27],[17,9,13],[17,18,22],[13,4,8],[13,13,18],[13,23,27],[9,9,13],[9,18,22],[5,2,13],[5,18,29]],
  e:[[6,13,1],[25,13,1],[15,13,0],[11,9,0],[20,9,0],[6,5,1],[25,5,1]]},
 {c:['#8a4bd8','#d0a8ff'],
  p:[[21,2,9],[21,22,29],[21,13,18],[17,5,26],[13,2,9],[13,22,29],[13,13,18],[9,5,26],[5,2,9],[5,22,29],[5,13,18]],
  e:[[6,21,0],[25,21,0],[8,17,1],[23,17,1],[15,13,0],[10,9,1],[21,9,1],[15,5,0]]}
];

function buildMap(def){
  const m=[];for(let r=0;r<ROWS;r++)m.push(new Array(COLS).fill(0));
  for(let r=0;r<ROWS;r++)m[r][0]=m[r][1]=m[r][30]=m[r][31]=1;
  for(let c=0;c<COLS;c++)if(c<14||c>17){m[0][c]=1;m[ROWS-1][c]=1;}
  for(const[r,a,b]of def.p)for(let c=a;c<=b;c++)m[r][c]=1;
  return m;
}

// ---------- audio ----------
let AC=null,muted=false;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function snd(f1,f2,d,type='square',v=.07){
  if(muted||!AC)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const MEL=[0,4,7,12,11,7,4,7,9,5,9,12,11,7,2,7,0,4,7,12,14,12,11,9,7,9,11,12,7,-1,7,-1];
const BAS=[0,0,9,9,5,5,7,7];
function music(){
  if(frameN%9)return;
  const i=(frameN/9|0)%MEL.length,n=MEL[i];
  if(n>=0)snd(523.25*2**(n/12),523.25*2**(n/12),.08,'square',.025);
  if(i%4===0){const b=130.8*2**(BAS[(i/4|0)%BAS.length]/12);snd(b,b,.3,'triangle',.06);}
}

// ---------- input ----------
const keys={},pressed={};
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',Space:'jump',KeyK:'jump',
  KeyX:'fire',KeyJ:'fire',ControlLeft:'fire',ControlRight:'fire',Enter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();audio();if(!e.repeat)pressed[k]=true;keys[k]=true;});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
// touch: metà sinistra = joystick a scomparsa (trascina per muovere, su per saltare), metà destra = tocca per la bolla
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
let tMove=null,tFire=null;
document.addEventListener('pointerdown',e=>{
  audio();
  if(e.pointerType==='mouse'){if(e.target===cv)pressed.start=true;return;}
  e.preventDefault();
  if(state==='title'||state==='over'){pressed.start=true;return;}
  if(e.clientX<innerWidth/2){
    if(tMove)return;
    tMove={id:e.pointerId,x0:e.clientX,y0:e.clientY,up:false};
    stickEl.style.left=e.clientX+'px';stickEl.style.top=e.clientY+'px';stickEl.style.display='block';knob.style.transform='';
  }else{tFire=e.pointerId;pressed.fire=true;keys.fire=true;}
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!tMove||e.pointerId!==tMove.id)return;
  e.preventDefault();
  let dx=e.clientX-tMove.x0,dy=e.clientY-tMove.y0;
  if(dx>40){tMove.x0=e.clientX-40;dx=40;}else if(dx<-40){tMove.x0=e.clientX+40;dx=-40;}
  if(dy>30){tMove.y0=e.clientY-30;dy=30;}
  stickEl.style.left=tMove.x0+'px';stickEl.style.top=tMove.y0+'px';
  keys.left=dx<-12;keys.right=dx>12;
  if(dy<-30){if(!tMove.up){tMove.up=true;pressed.jump=true;}keys.jump=true;}
  else if(dy>-18){tMove.up=false;keys.jump=false;}
  knob.style.transform=`translate(${dx}px,${Math.max(-40,dy)}px)`;
},{passive:false});
function endTouch(e){
  if(tMove&&e.pointerId===tMove.id){tMove=null;keys.left=keys.right=keys.jump=false;stickEl.style.display='none';}
  if(e.pointerId===tFire){tFire=null;keys.fire=false;}
}
for(const ev of['pointerup','pointercancel'])document.addEventListener(ev,endTouch);

// ---------- stato ----------
let state='title',score=0,hi=0,lives=3,round=0,speedMul=1,nextLife=30000;
let map,lvl,mapC,P,enemies=[],bubbles=[],fruits=[],parts=[],texts=[],ghost=null;
let timer=0,levelTime=0,frameN=0,paused=false;
try{hi=+localStorage.getItem('bollamania_hi')||0;}catch(e){}
function saveHi(){try{localStorage.setItem('bollamania_hi',hi);}catch(e){}}

function startGame(){score=0;lives=3;nextLife=30000;loadRound(0);}
function loadRound(n){
  round=n;lvl=LEVELS[n%LEVELS.length];speedMul=1+.2*Math.floor(n/LEVELS.length);
  map=buildMap(lvl);renderMap();
  P=newPlayer();
  enemies=lvl.e.map(([c,r,t])=>({x:c*T,y:r*T-24,w:24,h:24,vy:0,dir:c<16?1:-1,t,state:'walk',angry:false,
    jt:40+Math.random()*80,onGround:false,rot:0,vx:0,dt:0}));
  bubbles=[];fruits=[];parts=[];texts=[];ghost=null;levelTime=0;state='intro';timer=120;
}
function newPlayer(){return{x:3*T,y:MAPH-T-26,w:24,h:26,vy:0,dir:1,onGround:false,inv:120,dead:0,cd:0,walk:0};}
function renderMap(){
  mapC=document.createElement('canvas');mapC.width=W;mapC.height=MAPH;
  const g=mapC.getContext('2d'),[c1,c2]=lvl.c;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(map[r][c]){
    const x=c*T,y=r*T;
    g.fillStyle=c1;g.fillRect(x,y,T,T);
    g.fillStyle=c2;g.fillRect(x,y,T,2);g.fillRect(x,y,2,T);
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+T-2,y,2,T);g.fillRect(x,y+T-2,T,2);
    g.fillStyle=c2;g.fillRect(x+6,y+6,4,4);
  }
}

// ---------- fisica ----------
function moveX(e,dx){
  e.x+=dx;const mn=2*T,mx=30*T-e.w;
  if(e.x<mn){e.x=mn;return true;} if(e.x>mx){e.x=mx;return true;} return false;
}
function moveY(e){
  const oldB=e.y+e.h;e.y+=e.vy;e.onGround=false;
  const c1=Math.max(0,Math.floor((e.x+2)/T)),c2=Math.min(COLS-1,Math.floor((e.x+e.w-3)/T));
  if(e.vy>0){
    const r=Math.floor((e.y+e.h)/T);
    if(r>=0&&r<ROWS&&oldB<=r*T+.001)
      for(let c=c1;c<=c2;c++)if(map[r][c]){e.y=r*T-e.h;e.vy=0;e.onGround=true;break;}
  }else if(e.vy<0&&e.y<T&&e.y+e.h>0){
    for(let c=c1;c<=c2;c++)if(map[0][c]){e.y=T;e.vy=0;break;}
  }
  if(e.y>MAPH)e.y=-e.h;else if(e.y<-e.h-2)e.y=MAPH;
}
const ov=(a,b,s=0)=>a.x+s<b.x+b.w-s&&a.x+a.w-s>b.x+s&&a.y+s<b.y+b.h-s&&a.y+a.h-s>b.y+s;
function touchC(p,b){
  const cx=Math.max(p.x,Math.min(b.x,p.x+p.w)),cy=Math.max(p.y,Math.min(b.y,p.y+p.h));
  return(cx-b.x)**2+(cy-b.y)**2<R*R;
}
const R=14; // raggio bolla

// ---------- logica ----------
function addScore(pts,x,y){
  score+=pts;if(score>hi)hi=score;
  if(score>=nextLife){lives++;nextLife+=30000;snd(600,1200,.4,'square',.08);texts.push({x:256,y:200,s:'VITA EXTRA!',t:90,big:1});}
  if(x!==undefined)texts.push({x,y,s:String(pts),t:50});
}
function burst(x,y,col,n=8){
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;parts.push({x,y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,t:18,col});}
}
function killPlayer(){
  if(P.dead||P.inv>0)return;
  P.dead=110;lives--;snd(500,60,.9,'sawtooth',.08);
}
function shoot(){
  bubbles.push({x:P.x+P.w/2+P.dir*10,y:P.y+13,vx:P.dir*5,state:'shot',t:0,life:0,enemy:null,chain:0,pd:0,dead:false});
  snd(700,1300,.08,'triangle',.08);
}
function popBubble(b){
  if(b.dead)return;b.dead=true;burst(b.x,b.y,b.enemy?'#ffd23f':'#9fffc8');
  if(b.enemy){
    const e=b.enemy;e.state='dying';e.vx=(Math.random()<.5?-1:1)*(1.5+Math.random()*1.5);e.vy=-5;e.dt=0;
    addScore(1000*2**Math.min(b.chain,3),b.x,b.y);snd(900,200,.25,'square',.08);
  }else{addScore(10);snd(500,300,.06,'square',.05);}
  for(const o of bubbles)if(!o.dead&&!o.pd&&o.state==='float'&&Math.hypot(o.x-b.x,o.y-b.y)<2*R+6){o.pd=5;o.chain=b.chain+1;}
}
function release(b){
  b.dead=true;const e=b.enemy;burst(b.x,b.y,'#ff5a5a');
  e.state='walk';e.angry=true;e.x=Math.max(2*T,Math.min(30*T-e.w,b.x-12));e.y=b.y-12;e.vy=0;
}

function updatePlayer(){
  const p=P;
  if(p.dead){
    p.dead--;
    if(p.dead===0){
      if(lives<=0){state='over';timer=120;saveHi();}
      else{P=newPlayer();ghost=null;levelTime=Math.min(levelTime,60*20);}
    }
    return;
  }
  if(p.inv>0)p.inv--;
  let mv=0;if(keys.left){mv=-1;p.dir=-1;}if(keys.right){mv=1;p.dir=1;}
  moveX(p,mv*1.6);
  p.walk=mv&&p.onGround?p.walk+1:0;
  if(pressed.jump&&p.onGround){p.vy=-6.8;snd(300,650,.12,'square',.06);}
  p.vy=Math.min(p.vy+.3,3.6);moveY(p);
  if(p.cd>0)p.cd--;
  if(pressed.fire&&p.cd===0){shoot();p.cd=12;}
}

function updateBubbles(){
  for(const b of bubbles){
    if(b.dead)continue;
    b.t++;
    if(b.pd>0){if(--b.pd===0)popBubble(b);continue;}
    if(b.state==='shot'){
      b.x+=b.vx;
      if(b.x<2*T+R){b.x=2*T+R;b.state='float';}
      if(b.x>30*T-R){b.x=30*T-R;b.state='float';}
      if(b.t>20)b.state='float';
      for(const e of enemies)if(e.state==='walk'&&Math.abs(e.x+12-b.x)<18&&Math.abs(e.y+12-b.y)<18){
        b.enemy=e;e.state='trapped';b.state='float';b.life=0;snd(300,900,.15,'triangle',.08);break;
      }
    }else{
      b.life++;
      const top=T+R+1;
      if(b.y>top)b.y=Math.max(top,b.y-(b.enemy?.45:.6));
      if(b.y<top+30){const dx=256-b.x;b.x+=Math.sign(dx)*Math.min(Math.abs(dx),.35);}
      b.x+=Math.sin((b.t+b.x)*.05)*.15;
      b.x=Math.max(2*T+R,Math.min(30*T-R,b.x));
      if(b.enemy){b.enemy.x=b.x-12;b.enemy.y=b.y-12;if(b.life>480)release(b);}
      else if(b.life>600){b.dead=true;burst(b.x,b.y,'#9fffc8',4);}
    }
  }
  const fl=bubbles.filter(b=>!b.dead&&b.state==='float');
  for(let i=0;i<fl.length;i++)for(let j=i+1;j<fl.length;j++){
    const a=fl[i],b=fl[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<2*R&&d>0){const o=(2*R-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;}
  }
  if(!P.dead)for(const b of bubbles){
    if(b.dead||b.pd||b.state!=='float'||!touchC(P,b))continue;
    if(P.vy>0&&P.y+P.h<b.y&&keys.jump){P.vy=-6.2;snd(400,800,.1,'triangle',.06);}
    else popBubble(b);
  }
  bubbles=bubbles.filter(b=>!b.dead);
}

function updateEnemies(){
  for(const e of enemies){
    if(e.state==='walk'){
      const s=(e.t===1?.9:.7)*(e.angry?1.9:1)*speedMul;
      if(moveX(e,e.dir*s))e.dir*=-1;
      e.vy=Math.min(e.vy+.3,3.2);moveY(e);
      if(e.onGround&&--e.jt<=0){
        const above=!P.dead&&P.y+P.h<e.y-4;
        if(e.t===1?Math.random()<.7:above&&Math.random()<.6)e.vy=-6.8;
        else if(Math.random()<.5)e.dir=P.x<e.x?-1:1;
        e.jt=(e.t===1?40:70)+Math.random()*80*(e.angry?.5:1);
      }
      if(!P.dead&&ov(e,P,4))killPlayer();
    }else if(e.state==='dying'){
      e.dt++;e.rot+=.3;
      if(moveX(e,e.vx))e.vx*=-1;
      e.vy=Math.min(e.vy+.25,4);
      if(e.dt>25){moveY(e);if(e.onGround||e.dt>400){e.state='gone';spawnFruit(e.x,e.y+e.h);}}
      else{e.y+=e.vy;if(e.y<-e.h-2)e.y=MAPH;}
    }
  }
  enemies=enemies.filter(e=>e.state!=='gone');
}
const FRUIT_PTS=[200,500,1000,2000];
function spawnFruit(x,y){fruits.push({x,y:y-20,w:20,h:20,vy:0,k:Math.random()*4|0,life:0,onGround:false});}
function updateFruits(){
  for(const f of fruits){
    f.life++;f.vy=Math.min(f.vy+.3,3);moveY(f);
    if(!P.dead&&ov(f,P)){f.got=true;addScore(FRUIT_PTS[f.k],f.x+10,f.y);snd(800,1600,.15,'square',.06);}
  }
  fruits=fruits.filter(f=>!f.got&&f.life<600);
}
function updateGhost(){
  if(levelTime===60*45&&!ghost){ghost={x:256,y:-24,w:24,h:24};snd(200,100,.6,'sawtooth',.06);}
  if(!ghost||P.dead)return;
  const dx=P.x-ghost.x,dy=P.y-ghost.y,d=Math.hypot(dx,dy)||1,s=.9*speedMul;
  ghost.x+=dx/d*s;ghost.y+=dy/d*s;
  if(ov(ghost,P,4))killPlayer();
}

function update(){
  frameN++;
  if(pressed.mute)muted=!muted;
  if(state==='title'){if(pressed.jump||pressed.fire||pressed.start)startGame();return;}
  if(state==='over'){if(--timer<=0&&(pressed.jump||pressed.fire||pressed.start))state='title';return;}
  if(pressed.pause)paused=!paused;
  if(paused)return;
  if(state==='intro'){if(--timer<=0)state='play';return;}
  if(!muted)music();
  levelTime++;
  if(levelTime===60*35&&state==='play'){
    texts.push({x:256,y:190,s:'SBRIGATI!',t:120,big:1});snd(880,440,.5,'square',.07);
    for(const e of enemies)if(e.state==='walk')e.angry=true;
  }
  updatePlayer();
  if(state==='over')return;
  updateBubbles();updateEnemies();updateFruits();
  if(state==='play')updateGhost();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.t--;}parts=parts.filter(p=>p.t>0);
  for(const t of texts){t.t--;if(!t.big)t.y-=.5;}texts=texts.filter(t=>t.t>0);
  if(state==='play'&&enemies.length===0){state='clear';timer=200;ghost=null;}
  if(state==='clear'&&--timer<=0)loadRound(round+1);
}

// ---------- disegno ----------
function txt(s,x,y,col,size=8,align='left'){
  ctx.font=size+'px "Press Start 2P", monospace';ctx.textAlign=align;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y);
}
const pad=n=>String(n).padStart(7,' ');
function drawSpr(img,x,y,rot=0){
  if(!rot){ctx.drawImage(img,Math.round(x),Math.round(y+OY));return;}
  ctx.save();ctx.translate(Math.round(x+img.width/2),Math.round(y+OY+img.height/2));ctx.rotate(rot);
  ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore();
}
function enemySpr(e){return SE[e.t][e.angry?'a':'n'][e.dir<0?'l':'r'];}
function drawFruit(f){
  if(f.life>480&&frameN%8<4)return;
  ctx.save();ctx.translate(f.x+10,f.y+OY+10);ctx.scale(1.6,1.6);
  const x=0,y=0;
  if(f.k===0){ctx.fillStyle='#3a3';ctx.fillRect(x-1,y-7,2,5);ctx.fillStyle='#e22';
    ctx.beginPath();ctx.arc(x-3,y+2,4,0,7);ctx.arc(x+3,y+2,4,0,7);ctx.fill();}
  else if(f.k===1){ctx.fillStyle='#ffe23f';ctx.beginPath();ctx.ellipse(x,y,6,4,0,0,7);ctx.fill();
    ctx.fillStyle='#fff8';ctx.fillRect(x-3,y-2,3,1);}
  else if(f.k===2){ctx.fillStyle='#2b8a2b';ctx.beginPath();ctx.arc(x,y-2,7,0,Math.PI);ctx.fill();
    ctx.fillStyle='#ff4f6a';ctx.beginPath();ctx.arc(x,y-2,5,0,Math.PI);ctx.fill();}
  else{ctx.fillStyle='#5ff';ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+6,y);ctx.lineTo(x,y+6);ctx.lineTo(x-6,y);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(x-2,y-3,2,2);}
  ctx.restore();
}
function drawBubble(b){
  let col='#7dffb2';
  if(b.enemy){col=b.life>400?(frameN%10<5?'#ff5a5a':'#ffd23f'):b.life>280?'#ffd23f':'#7dffb2';drawSpr(enemySpr(b.enemy),b.x-12,b.y-12);}
  else if(b.life>520&&frameN%8<4)return;
  const y=b.y+OY;
  ctx.globalAlpha=.22;ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x,y,R,0,7);ctx.fill();
  ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,y,R,0,7);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(b.x-7,y-9,3,3);ctx.fillRect(b.x-9,y-6,2,3);
}
function drawHUD(){
  txt('1UP',24,4,'#ff5a8a');txt(pad(score),8,16,'#fff');
  txt('RECORD',256,4,'#ff5a8a',8,'center');txt(pad(hi),228,16,'#fff');
  txt('ROUND '+(round+1),488,4,'#7dffb2',8,'right');
  ctx.drawImage(SP.r,440,14,10,11);txt('x'+lives,488,17,'#fff',8,'right');
  if(muted)txt('MUTO',488,H-12,'#666',8,'right');
}
function drawTitle(){
  for(let i=0;i<14;i++){
    const x=(i*83+frameN*.3*(1+i%3))%W,y=H-((frameN*(.4+i%4*.2)+i*97)%(H+40))+20;
    ctx.globalAlpha=.35;ctx.strokeStyle='#7dffb2';ctx.beginPath();ctx.arc(x,y,6+i%4*4,0,7);ctx.stroke();ctx.globalAlpha=1;
  }
  const name='BOLLAMANIA',cols=['#ff5a8a','#ffd23f','#7dffb2','#4fa8ff','#b76bff'];
  for(let i=0;i<name.length;i++)txt(name[i],256-name.length*14+i*28+4,110+Math.sin(frameN*.08+i*.6)*6,cols[i%5],24);
  ctx.drawImage(SP.r,206,164,48,52);ctx.drawImage(SE[0].n.l,266,168,48,48);
  txt('INTRAPPOLA I MOSTRI NELLE BOLLE',256,236,'#fff',8,'center');
  txt('E FALLE SCOPPIARE!',256,252,'#fff',8,'center');
  if(isTouch){
    txt('DITO A SINISTRA:',256,290,'#ffd23f',8,'center');
    txt('TRASCINA = MUOVI   SU = SALTA',256,306,'#9cc8ff',8,'center');
    txt('DITO A DESTRA:',256,326,'#ffd23f',8,'center');
    txt('TOCCA = SPARA BOLLA',256,342,'#9cc8ff',8,'center');
  }else{
    txt('FRECCE / A D  MUOVI',256,290,'#9cc8ff',8,'center');
    txt('Z / SPAZIO  SALTA',256,306,'#9cc8ff',8,'center');
    txt('X / J  SPARA BOLLA',256,322,'#9cc8ff',8,'center');
    txt('P PAUSA   M AUDIO',256,338,'#9cc8ff',8,'center');
  }
  if(frameN%60<40)txt('PREMI INVIO O TOCCA',256,376,'#ffd23f',8,'center');
  txt('RECORD '+hi,256,410,'#ff5a8a',8,'center');
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='title'){drawTitle();return;}
  ctx.drawImage(mapC,0,OY);
  fruits.forEach(drawFruit);
  for(const e of enemies){
    if(e.state==='walk')drawSpr(enemySpr(e),e.x,e.y);
    else if(e.state==='dying')drawSpr(SE[e.t].a.r,e.x,e.y,e.rot);
  }
  bubbles.forEach(drawBubble);
  if(P.dead)drawSpr(SP[P.dir<0?'l':'r'],P.x,P.y,P.dead*.25);
  else if(!(P.inv>0&&frameN%6<3))drawSpr(SP[P.dir<0?'l':'r'],P.x,P.y-((P.walk>>3)&1)*2);
  if(ghost)drawSpr(SG,ghost.x,ghost.y);
  for(const p of parts){ctx.fillStyle=p.col;ctx.fillRect(p.x-1,p.y+OY-1,2,2);}
  for(const t of texts)
    if(t.big){if(frameN%16<11)txt(t.s,t.x,t.y+OY,'#ff5a5a',16,'center');}
    else txt(t.s,t.x,t.y+OY,'#fff',8,'center');
  drawHUD();
  if(state==='intro'){txt('ROUND '+(round+1),256,190,'#ffd23f',16,'center');txt('PRONTI!',256,216,'#fff',8,'center');
    if(isTouch&&round===0){txt('SINISTRA: TRASCINA E SU',256,250,'#9cc8ff',8,'center');txt('DESTRA: TOCCA PER LA BOLLA',256,266,'#9cc8ff',8,'center');}}
  if(state==='clear'&&timer<140)txt('ROUND COMPLETATO!',256,200,'#7dffb2',16,'center');
  if(state==='over'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    txt('GAME OVER',256,190,'#ff5a5a',24,'center');txt('PUNTI '+score,256,232,'#fff',8,'center');
    if(timer<=0&&frameN%60<40)txt('PREMI INVIO O TOCCA',256,260,'#ffd23f',8,'center');}
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSA',256,210,'#fff',16,'center');}
}

// ---------- loop ----------
let acc=0,last=performance.now();
function frame(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();for(const k in pressed)pressed[k]=false;acc-=1000/60;}
  render();requestAnimationFrame(frame);
}
function fit(){
  let s=Math.min(innerWidth/W,(innerHeight-8)/H);
  if(s>=1)s=Math.floor(s*4)/4;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
}
addEventListener('resize',fit);fit();
document.fonts&&document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(frame);
// funzionamento offline (solo quando il gioco è servito da un sito, es. GitHub Pages)
if('serviceWorker'in navigator&&location.protocol!=='file:')
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
